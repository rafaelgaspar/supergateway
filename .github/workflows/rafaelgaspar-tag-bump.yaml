# Thin caller to drop into a fork at .github/workflows/rafaelgaspar-tag-bump.yaml
# Fill in with: from members.yaml (upstream_url, tag_glob, tag_filter, publish_workflow).
# Calls the pack reusable vendored beside it (GitHub will not uses: a file from
# fork-pack/dot-github — reusable workflows must live under .github/workflows).
name: rafaelgaspar Tag Bump

on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Upstream release tag. Leave empty to use latest matching git tag.
        required: false
        type: string
      dry_run:
        description: Validate stack order only (no rebase or push)
        required: false
        type: boolean
        default: false
      squash:
        description: Squash each feat layer to one commit during rebuild
        required: false
        type: boolean
        default: true

concurrency:
  group: rafaelgaspar-tag-bump
  cancel-in-progress: false

permissions: {}

jobs:
  bump:
    uses: ./.github/workflows/rafaelgaspar-tag-bump-reusable.yaml
    with:
      upstream_url: https://github.com/supercorp-ai/supergateway.git
      tag_glob: 'v*.*.*'
      tag_filter: '^v[0-9]+\.[0-9]+\.[0-9]+$'
      upstream_tag: ${{ inputs.upstream_tag }}
      dry_run: ${{ inputs.dry_run }}
      squash: ${{ inputs.squash }}
      event_name: ${{ github.event_name }}
    secrets: inherit
    permissions:
      contents: write
      packages: write

  publish:
    name: Publish integration release
    needs: bump
    if: needs.bump.outputs.should_release == 'true'
    uses: ./.github/workflows/rafaelgaspar-ghcr-publish.yaml
    with:
      ref: rafaelgaspar
    secrets: inherit
    permissions:
      contents: write
      packages: write
